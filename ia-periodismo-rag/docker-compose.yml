version: '3.8'

services:
  db_vector:
    image: pgvector/pgvector:pg16
    container_name: periodismo_pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: periodismo_rag
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data